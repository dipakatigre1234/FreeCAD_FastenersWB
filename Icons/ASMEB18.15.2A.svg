<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" version="1.1" viewBox="0 0 12.7 12.7" xmlns="http://www.w3.org/2000/svg">
 <!-- Eye ring (teal fill) -->
 <g fill="#5fd3c2">
  <!-- Outer circle of ring -->
  <circle cx="6.35" cy="2.8" r="2.2"/>
  <!-- Neck between ring and shoulder -->
  <rect x="5.75" y="4.5" width="1.2" height="1.2"/>
  <!-- Shoulder flange (wider) -->
  <rect x="4.45" y="5.7" width="3.8" height="0.85" rx="0.1"/>
  <!-- Shank body below shoulder -->
  <rect x="5.75" y="6.55" width="1.2" height="5.55" rx="0.12"/>
 </g>
 <!-- Inner hole of ring (punched out in white) -->
 <circle cx="6.35" cy="2.8" r="1.1" fill="#ffffff"/>
 <!-- Outlines -->
 <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width=".28">
  <!-- Eye outer ring -->
  <circle cx="6.35" cy="2.8" r="2.2"/>
  <!-- Eye inner hole -->
  <circle cx="6.35" cy="2.8" r="1.1"/>
  <!-- Neck outline -->
  <rect x="5.75" y="4.5" width="1.2" height="1.2"/>
  <!-- Shoulder flange outline -->
  <rect x="4.45" y="5.7" width="3.8" height="0.85" rx="0.1"/>
  <!-- Shank outline -->
  <rect x="5.75" y="6.55" width="1.2" height="5.55" rx="0.12"/>
  <!-- Thread lines on shank -->
  <line x1="5.75" y1="7.5" x2="6.95" y2="7.5"/>
  <line x1="5.75" y1="8.3" x2="6.95" y2="8.3"/>
  <line x1="5.75" y1="9.1" x2="6.95" y2="9.1"/>
  <line x1="5.75" y1="9.9" x2="6.95" y2="9.9"/>
  <line x1="5.75" y1="10.7" x2="6.95" y2="10.7"/>
 </g>
</svg>
